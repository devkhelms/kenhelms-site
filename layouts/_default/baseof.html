<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ block "main" . }}{{ end }}
  {{ partial "overlays.html" . }}
  {{ partial "footer.html" . }}
  {{ partial "boot.html" . }}
  {{- $v := partial "asset-version.html" . -}}
  <script src="{{ printf "%s?v=%s" ("js/overlays.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/passwords.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/drive-c.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/contact.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/snake.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/boot.js" | relURL) $v }}"></script>
  <script src="{{ printf "%s?v=%s" ("js/site-ui.js" | relURL) $v }}"></script>
</body>
</html>
