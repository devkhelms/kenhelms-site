<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ block "main" . }}{{ end }}
  {{ partial "overlays.html" . }}
  <script>
  window.SiteMenu = {
    activate: function (id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (window.__handleMenuAction) window.__handleMenuAction(id);
      return false;
    },
    toggleStart: function (e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (window.__toggleStartMenu) window.__toggleStartMenu();
      return false;
    },
  };
  </script>
  {{ partial "footer.html" . }}
  {{ partial "boot.html" . }}
  <script src="{{ "js/overlays.js" | relURL }}"></script>
  <script src="{{ "js/passwords.js" | relURL }}"></script>
  <script src="{{ "js/drive-c.js" | relURL }}"></script>
  <script src="{{ "js/contact.js" | relURL }}"></script>
  <script src="{{ "js/snake.js" | relURL }}"></script>
  <script src="{{ "js/boot.js" | relURL }}"></script>
  <script src="{{ "js/site-ui.js" | relURL }}"></script>
</body>
</html>
