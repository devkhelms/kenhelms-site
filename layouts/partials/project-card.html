<article class="project-card">
  <header class="project-header">
    <h3 class="project-title">{{ .title }}<span class="file-ext">.EXE</span></h3>
  </header>
  <p class="project-description">{{ .description }}</p>
  {{ with .links.project_site }}
  <p class="project-open">
    <a class="win95-link-btn" href="{{ . }}" rel="noopener noreferrer">Open</a>
  </p>
  {{ end }}
</article>
