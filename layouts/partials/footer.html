<footer class="site-footer">
  <div class="taskbar">
    <div class="start-wrap">
      <button type="button" class="start-btn" id="start-btn" onclick="return window.SiteMenu.toggleStart(event)">Start</button>
      <div class="start-menu" id="start-menu">
        <button type="button" class="start-menu-item" id="launch-portfolio" onclick="return window.SiteMenu.activate('launch-portfolio', event)">Portfolio</button>
        <button type="button" class="start-menu-item" id="launch-files" onclick="return window.SiteMenu.activate('launch-files', event)">Files</button>
        <button type="button" class="start-menu-item" id="launch-snake" onclick="return window.SiteMenu.activate('launch-snake', event)">Snake</button>
        <button type="button" class="start-menu-item" id="launch-contact" onclick="return window.SiteMenu.activate('launch-contact', event)">Contact</button>
        <button type="button" class="start-menu-item" id="launch-passwords" onclick="return window.SiteMenu.activate('launch-passwords', event)">PASSWORDS.CSV</button>
        <hr class="start-menu-divider">
        <button type="button" class="start-menu-item" id="launch-reboot" onclick="return window.SiteMenu.activate('launch-reboot', event)">Restart...</button>
      </div>
    </div>
    <span class="taskbar-window">kenhelms.dev</span>
    <span class="taskbar-clock" id="taskbar-clock" aria-live="off"></span>
    <span class="taskbar-copy">&copy; {{ now.Year }}</span>
  </div>
</footer>
