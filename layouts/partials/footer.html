<footer class="site-footer">
  <div class="taskbar">
    <div class="start-wrap">
      <button type="button" class="start-btn" id="start-btn">Start</button>
      <div class="start-menu" id="start-menu">
        <button type="button" class="start-menu-item" id="launch-portfolio">Portfolio</button>
        <button type="button" class="start-menu-item" id="launch-snake">Snake</button>
        <button type="button" class="start-menu-item" id="launch-contact">Contact</button>
        <button type="button" class="start-menu-item" id="launch-passwords">PASSWORDS.CSV</button>
        <hr class="start-menu-divider">
        <button type="button" class="start-menu-item" id="launch-reboot">Restart...</button>
      </div>
    </div>
    <span class="taskbar-window">kenhelms.dev</span>
    <span class="taskbar-clock" id="taskbar-clock" aria-live="off"></span>
    <span class="taskbar-copy">&copy; {{ now.Year }}</span>
  </div>
</footer>
