<div class="game-overlay is-hidden" id="passwords-overlay" hidden aria-hidden="true">
  <div class="win95-window game-window passwords-prompt-window" role="dialog" aria-labelledby="passwords-title" aria-modal="true">
    <div class="title-bar">
      <span class="title-bar-text" id="passwords-title">C:\PASSWORDS.CSV</span>
      <div class="title-bar-controls">
        <button type="button" class="win95-btn passwords-close" aria-label="Close">×</button>
      </div>
    </div>
    <form class="game-body passwords-prompt-body" id="passwords-form">
      <p class="passwords-prompt-label">Please type password to continue:</p>
      <input class="contact-input passwords-input" type="password" id="passwords-input" autocomplete="off" spellcheck="false" maxlength="64">
      <div class="passwords-actions">
        <button type="submit" class="win95-link-btn">OK</button>
        <button type="button" class="win95-link-btn passwords-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="nedry-overlay is-hidden" id="nedry-overlay" hidden aria-hidden="true" role="alert">
  <div class="nedry-dialog">
    <div class="nedry-header">SECURITY SYSTEM</div>
    <div class="nedry-screen">
      <div class="nedry-avatar" aria-hidden="true"></div>
      <p class="nedry-ah" aria-hidden="true">Ah! Ah! Ah!</p>
      <p class="nedry-message">You didn't say the magic word!</p>
    </div>
    <button type="button" class="win95-link-btn nedry-dismiss">OK</button>
  </div>
</div>

<div class="game-overlay is-hidden" id="passwords-reward-overlay" hidden aria-hidden="true">
  <div class="win95-window game-window passwords-reward-window" role="dialog" aria-labelledby="passwords-reward-title" aria-modal="true">
    <div class="title-bar">
      <span class="title-bar-text" id="passwords-reward-title">C:\SECRET\quaid.bmp</span>
      <div class="title-bar-controls">
        <button type="button" class="win95-btn passwords-reward-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="game-body passwords-reward-body">
      <img class="passwords-quaid" id="passwords-quaid" data-src="{{ "images/quaid.webp" | relURL }}" alt="" width="640" height="800">
      <p class="passwords-visitor">Visitor #<span id="passwords-visitor-count">—</span></p>
    </div>
  </div>
</div>
