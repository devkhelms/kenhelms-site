<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.tagline }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="canonical" href="{{ .Site.BaseURL }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Site.BaseURL }}">
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.tagline }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.tagline }}">
<script>try{if(sessionStorage.getItem("kenhelms-boot-seen"))document.documentElement.classList.add("boot-skip")}catch(e){}</script>
<style>html.boot-active{overflow:hidden}</style>
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
